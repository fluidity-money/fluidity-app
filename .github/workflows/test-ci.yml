name: Run Tests (develop)

on:
  pull_request:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  test-go:
    runs-on: powerfulubuntu
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true
      - name: Install golang
        uses: cedrickring/golang-action@1.7.0
        with:
          args: go mod download -x
      - name: Install python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install semgrep
        run: |
          pip install semgrep
      - name: Setup infrastructure
        uses: isbang/compose-action@v1.3.2
        with:
          compose-file: "./tests/infrastructure/docker-compose.yml"
      - name: make test-go
        run: |
          make test-go
      - name: Discord
        uses: ./scripts/actions
        if: always()
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        with:
          command: |
            flu send-discord --webhook-url ${{ secrets.FLU_CI_DISCORD_WEBHOOK_URL }} --status ${{ job.status }}

  test-npm:
    runs-on: powerfulubuntu
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: npm test
        working-directory: web
        run: |
          yarn
          npm test
      - name: Discord
        uses: ./scripts/actions
        if: always()
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        with:
          command: |
            flu send-discord --webhook-url ${{ secrets.FLU_CI_DISCORD_WEBHOOK_URL }} --status ${{ job.status }}
